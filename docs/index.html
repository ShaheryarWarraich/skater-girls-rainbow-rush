<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Pakistan Wire</title>
<style>
  :root{--bg:#fbfaf7;--fg:#1a1a1a;--muted:#5c5c5c;--rule:#d8d4cc}
  @media (prefers-color-scheme:dark){
    :root{--bg:#14161a;--fg:#ececec;--muted:#9aa0a6;--rule:#2c3036}
  }
  body{background:var(--bg);color:var(--fg);margin:0;
       font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:grid;place-items:center;min-height:100vh;padding:2rem}
  main{max-width:34rem}
  h1{font:700 2.4rem/1.15 Georgia,"Times New Roman",serif;margin:0 0 .3rem}
  .rule{border:0;border-top:2px solid var(--fg);margin:.9rem 0}
  p{color:var(--muted)}
</style>
<main>
  <h1>The Pakistan Wire</h1>
  <hr class="rule">
  <p>What's happening in Pakistan, every morning.</p>
  <p>The first edition publishes at 07:00 Pakistan time. This page is replaced
     automatically by the daily build.</p>
</main>
